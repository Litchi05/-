<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 1 — Hook · kinetic-type-beats (Reproduce) · 1080x1920 · 6.165s -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Barlow";
          src: url("assets/fonts/Barlow-900.woff2") format("woff2");
          font-weight: 900;
          font-style: normal;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("assets/fonts/IBMPlexMono-400.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
        }

        .clip {
          position: absolute;
          inset: 0;
        }

        /* ── background: ink ground + faint mono digit columns ── */
        #hook1-bg {
          background: #111111;
        }
        #hook1-cols {
          position: absolute;
          inset: 0;
          display: flex;
          justify-content: space-around;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 30px;
          color: #f0ece5;
        }
        .hook1-col {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .hook1-col span {
          display: block;
          line-height: 48px;
        }

        /* ── content ── */
        #hook1-content {
          font-family: "Barlow", sans-serif;
          font-weight: 900;
          color: #f0ece5;
        }

        #hook1-glow {
          position: absolute;
          z-index: 1;
          left: 90px;
          top: 514px;
          width: 900px;
          height: 900px;
          background: radial-gradient(
            closest-side,
            rgba(232, 93, 38, 0.55),
            rgba(232, 93, 38, 0) 70%
          );
          opacity: 0;
          transform-origin: 50% 50%;
          pointer-events: none;
          will-change: transform, opacity;
        }

        .hook1-stack {
          position: absolute;
          left: 0;
          right: 0;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }

        /* Scene 1 stack — statement one */
        #hook1-s1 {
          top: 620px;
          gap: 16px;
        }
        .hook1-line {
          font-size: 108px;
          line-height: 0.95;
          letter-spacing: -0.03em;
          will-change: transform, filter, opacity;
        }
        #hook1-l2 {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        #hook1-rule1 {
          width: 340px;
          height: 1px;
          margin-top: 28px;
          background: #505048;
          transform-origin: 50% 50%;
          will-change: transform;
        }

        /* Scenes 2–3 stack — the turn */
        #hook1-s2 {
          top: 381px;
          gap: 20px;
        }
        .hook1-big {
          font-size: 136px;
          line-height: 0.92;
          letter-spacing: -0.03em;
          will-change: transform, opacity;
        }
        #hook1-q3 {
          font-size: 96px;
          line-height: 0.92;
          letter-spacing: -0.02em;
          color: #f0ece5;
          will-change: transform, opacity;
        }
        #hook1-both {
          font-size: 296px;
          line-height: 0.92;
          letter-spacing: -0.04em;
          color: #e85d26;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        #hook1-both-inner {
          display: block;
        }
        #hook1-once {
          font-size: 108px;
          line-height: 0.92;
          letter-spacing: -0.03em;
          will-change: transform, opacity;
        }
        #hook1-rule2 {
          width: 340px;
          height: 1px;
          margin-top: 24px;
          background: #505048;
          transform-origin: 50% 50%;
          will-change: transform;
        }
      </style>

      <div id="root" data-composition-id="01-hook" data-width="1080" data-height="1920">
        <!-- full-bleed ground on its own clip (never on #root) -->
        <div id="hook1-bg" class="clip" data-start="0" data-duration="6.165" data-track-index="0">
          <div id="hook1-cols"></div>
        </div>

        <div
          id="hook1-content"
          class="clip"
          data-start="0"
          data-duration="6.165"
          data-track-index="1"
        >
          <div id="hook1-glow"></div>

          <!-- Scene 1: "your computer / thinks in 0s and 1s." -->
          <div id="hook1-s1" class="hook1-stack" data-layout-allow-overlap>
            <div id="hook1-l1" class="hook1-line">your computer</div>
            <div id="hook1-l2">
              <div class="hook1-line">thinks in</div>
              <div class="hook1-line">0s and 1s.</div>
            </div>
            <div id="hook1-rule1"></div>
          </div>

          <!-- Scenes 2–3: "quantum computers / think in / BOTH / at once." -->
          <div id="hook1-s2" class="hook1-stack" data-layout-allow-overlap>
            <div id="hook1-q1" class="hook1-big">quantum</div>
            <div id="hook1-q2" class="hook1-big">computers</div>
            <div id="hook1-q3">think in</div>
            <div id="hook1-both"><span id="hook1-both-inner">both</span></div>
            <div id="hook1-once">at once.</div>
            <div id="hook1-rule2"></div>
          </div>
        </div>
      </div>

      <script src="assets/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        // ── deterministic "0 1" digit rain-columns (static texture after entrance) ──
        (function () {
          var colsEl = document.getElementById("hook1-cols");
          var NC = 9,
            NR = 40; // 40 rows x 48px line = 1920px, full bleed
          var html = "";
          for (var i = 0; i < NC; i++) {
            html += '<div class="hook1-col">';
            for (var j = 0; j < NR; j++) {
              var ch = (i * 7 + j * 13) % 3 === 0 ? "1" : "0";
              var op = (0.04 + ((i * 11 + j * 5) % 6) * 0.013).toFixed(3);
              html += '<span style="opacity:' + op + '">' + ch + "</span>";
            }
            html += "</div>";
          }
          colsEl.innerHTML = html;
        })();

        // ── one paused timeline, beats on the VO cues ──
        var tl = gsap.timeline({ paused: true });
        var D = 6.165;

        // Scene 1 (0.0–2.0s) — background texture fades up, then two kinetic beat-slams.
        tl.fromTo(
          "#hook1-cols",
          { opacity: 0 },
          { opacity: 1, duration: 0.9, ease: "power2.out" },
          0,
        );

        // B1 "your computer" — slam: scale + blur resolve (power4)
        tl.fromTo(
          "#hook1-l1",
          { scale: 1.5, filter: "blur(16px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
          0.1,
        );

        // B2 "thinks in 0s and 1s." — heavy rise (circ)
        tl.fromTo(
          "#hook1-l2",
          { y: 90, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
          0.85,
        );

        // supporting hairline draws under statement one
        tl.fromTo(
          "#hook1-rule1",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.4, ease: "power3.out" },
          1.2,
        );

        // Scene 2 (2.0–4.2s) — hard-cut word-swap at the sentence seam:
        // statement one clears instantly (the swap IS the beat)…
        tl.set("#hook1-s1", { opacity: 0 }, 2.0);

        // …and "quantum / computers" snap in split from opposite sides (expo), a step larger.
        tl.fromTo(
          "#hook1-q1",
          { x: -240, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" },
          2.04,
        );
        tl.fromTo(
          "#hook1-q2",
          { x: 240, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" },
          2.12,
        );

        // "think in" lands on its spoken cue
        tl.fromTo(
          "#hook1-q3",
          { y: 70, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
          3.35,
        );

        // Scene 3 (4.2–6.165s) — "both" spring-pops on the spoken word:
        // fromTo scale 0 -> 1, smooth long-tail settle, no overshoot (power3).
        tl.fromTo(
          "#hook1-both",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
          4.25,
        );

        // faint ambient glow blooms behind the orange word, landing with its settle
        tl.fromTo(
          "#hook1-glow",
          { opacity: 0, scale: 0.85 },
          { opacity: 0.22, scale: 1, duration: 0.85, ease: "power2.out" },
          4.3,
        );

        // "at once." stamps beneath on its cue
        tl.fromTo(
          "#hook1-once",
          { scale: 1.3, y: -46, opacity: 0 },
          { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
          5.05,
        );

        // second hairline seals the stack
        tl.fromTo(
          "#hook1-rule2",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.35, ease: "power3.out" },
          5.35,
        );

        // Hold: type dead still; only a bounded micro-breathe on the glow
        // (finite sine via a phase driver — sin(0)=0 so it starts at the bloom's rest state).
        var glowEl = document.getElementById("hook1-glow");
        var phase = { p: 0 };
        var BREATHE_START = 5.3;
        tl.to(
          phase,
          {
            p: Math.PI * 2,
            duration: D - BREATHE_START,
            ease: "none",
            onUpdate: function () {
              var s = Math.sin(phase.p);
              glowEl.style.opacity = String(0.22 + s * 0.018);
              glowEl.style.transform = "scale(" + (1 + s * 0.006) + ")";
            },
          },
          BREATHE_START,
        );

        window.__timelines["01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
