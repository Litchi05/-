<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 2 — The spinning coin · kinetic-type-beats (Adapt) · 1080x1920 · 8.448s -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Barlow";
          src: url("assets/fonts/Barlow-900.woff2") format("woff2");
          font-weight: 900;
          font-style: normal;
        }
        @font-face {
          font-family: "Barlow";
          src: url("assets/fonts/Barlow-700.woff2") format("woff2");
          font-weight: 700;
          font-style: normal;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2");
          font-weight: 500;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
        }

        .clip {
          position: absolute;
          inset: 0;
        }

        /* ── background: ink ground + hairline grid rules ── */
        #coin2-bg {
          background: #111111;
        }
        .coin2-grid-h {
          position: absolute;
          left: 0;
          right: 0;
          height: 1px;
          background: #282826;
        }
        .coin2-grid-v {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 1px;
          background: #282826;
        }

        /* ── coin: upper third, ~45% width ── */
        #coin2-stage {
          position: absolute;
          left: 0;
          right: 0;
          top: 330px;
          height: 560px;
          perspective: 1400px;
        }
        #coin2-glow {
          position: absolute;
          left: 190px;
          top: -70px;
          width: 700px;
          height: 700px;
          background: radial-gradient(
            closest-side,
            rgba(232, 93, 38, 0.5),
            rgba(232, 93, 38, 0) 70%
          );
          opacity: 0;
          will-change: transform, opacity;
        }
        #coin2-flip {
          position: absolute;
          left: 296px;
          top: 36px;
          width: 488px;
          height: 488px;
          transform-style: preserve-3d;
          will-change: transform, filter;
        }
        #coin2-svg {
          display: block;
          width: 488px;
          height: 488px;
        }
        #coin2-svg .ring {
          fill: none;
          stroke: #f0ece5;
          stroke-width: 3;
        }
        #coin2-svg .mid {
          fill: none;
          stroke: #505048;
          stroke-width: 2;
        }
        #coin2-svg text {
          font-family: "Barlow", sans-serif;
          font-weight: 900;
          font-size: 150px;
          fill: #f0ece5;
        }

        /* ── labels: stacked beneath the coin ── */
        #coin2-labels {
          position: absolute;
          left: 0;
          right: 0;
          top: 1010px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 26px;
          font-family: "Barlow", sans-serif;
          color: #f0ece5;
        }
        .coin2-swapbox {
          position: relative;
          width: 100%;
        }
        .coin2-state {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          will-change: transform, opacity;
        }
        #coin2-name-box {
          height: 140px;
        }
        .coin2-name {
          font-size: 124px;
          font-weight: 900;
          line-height: 1.0;
          letter-spacing: -0.03em;
          text-transform: lowercase;
        }
        #coin2-heads-box {
          height: 110px;
        }
        .coin2-heads {
          font-size: 88px;
          font-weight: 700;
          line-height: 1.0;
          letter-spacing: -0.02em;
          text-transform: lowercase;
          color: #888880;
        }
        .coin2-heads .em {
          color: #e85d26;
        }

        /* ── coined-term mono bar ── */
        #coin2-term {
          position: absolute;
          left: 64px;
          right: 64px;
          top: 1380px;
          height: 116px;
          border-top: 1px solid #282826;
          border-bottom: 1px solid #282826;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 52px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #f0ece5;
          will-change: transform, opacity;
        }
        #coin2-term .slash {
          color: #e85d26;
          margin-right: 28px;
        }
      </style>

      <div id="root" data-composition-id="02-spinning-coin" data-width="1080" data-height="1920">
        <!-- full-bleed ground on its own clip -->
        <div id="coin2-bg" class="clip" data-start="0" data-duration="8.448" data-track-index="0">
          <div class="coin2-grid-h" style="top: 306px"></div>
          <div class="coin2-grid-h" style="top: 946px"></div>
          <div class="coin2-grid-v" style="left: 64px"></div>
          <div class="coin2-grid-v" style="left: 1015px"></div>
        </div>

        <div id="coin2-content" class="clip" data-start="0" data-duration="8.448" data-track-index="1">
          <div id="coin2-stage">
            <div id="coin2-glow"></div>
            <div id="coin2-flip">
              <svg id="coin2-svg" viewBox="0 0 488 488">
                <circle class="ring" id="coin2-ring" cx="244" cy="244" r="230" />
                <line class="mid" id="coin2-mid" x1="244" y1="30" x2="244" y2="458" />
                <text id="coin2-zero" x="132" y="296" text-anchor="middle">0</text>
                <text id="coin2-one" x="356" y="296" text-anchor="middle">1</text>
              </svg>
            </div>
          </div>

          <div id="coin2-labels">
            <div class="coin2-swapbox" id="coin2-name-box">
              <div class="coin2-state coin2-name" id="coin2-name-a" data-layout-allow-overlap>a normal bit</div>
              <div class="coin2-state coin2-name" id="coin2-name-b" data-layout-allow-overlap>a qubit</div>
            </div>
            <div class="coin2-swapbox" id="coin2-heads-box">
              <div class="coin2-state coin2-heads" id="coin2-heads-a" data-layout-allow-overlap>heads <span class="em">or</span> tails</div>
              <div class="coin2-state coin2-heads" id="coin2-heads-b" data-layout-allow-overlap>heads <span class="em">and</span> tails</div>
            </div>
          </div>

          <div id="coin2-term"><span class="slash">/</span>superposition</div>
        </div>
      </div>

      <script src="assets/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });
        var D = 8.448;

        // ── Scene 1 (0.0–2.7s) — the coin draws itself in as the VO says "a coin lying flat" ──
        var ring = document.getElementById("coin2-ring");
        var CIRC = 2 * Math.PI * 230;
        ring.style.strokeDasharray = CIRC;

        tl.fromTo("#coin2-content", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

        // svg-path-draw: ring strokes on, then the midline, then the digits fade up
        tl.fromTo(
          ring,
          { strokeDashoffset: CIRC },
          { strokeDashoffset: 0, duration: 1.0, ease: "power3.inOut" },
          0.3,
        );
        tl.fromTo(
          "#coin2-mid",
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power2.out" },
          1.2,
        );
        tl.fromTo(
          "#coin2-zero",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power3.out" },
          1.35,
        );
        tl.fromTo(
          "#coin2-one",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power3.out" },
          1.5,
        );

        // label "a normal bit" on its cue, then "heads OR tails"
        tl.fromTo(
          "#coin2-name-a",
          { y: 70, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
          0.65,
        );
        tl.fromTo(
          "#coin2-heads-a",
          { y: 55, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "circ.out" },
          2.2,
        );
        // b-states wait invisible (fromTo-claimed so seek-to-0 is correct)
        tl.fromTo("#coin2-name-b", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        tl.fromTo("#coin2-heads-b", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        tl.fromTo("#coin2-term", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

        // ── Scene 2 (2.7–5.7s) — the swap beats + the kick into spin ──
        // hard-cut word-swap on "A qubit" (~3.55s): name a → name b, instant (the swap IS the beat)
        tl.set("#coin2-name-a", { opacity: 0 }, 3.55);
        tl.set("#coin2-name-b", { opacity: 1 }, 3.55);

        // on "spinning" (~4.45s) the coin kicks up into a fast 3D flip:
        // finite rotationY chain — fast attack with motion blur, long-tail decel, settle tilt.
        tl.to(
          "#coin2-flip",
          { rotationY: 1440, duration: 1.7, ease: "power2.in" },
          4.45,
        );
        tl.to(
          "#coin2-flip",
          { rotationY: 2540, duration: 1.9, ease: "power3.out" },
          6.15,
        );
        // blur streak on the kick, resolving as the spin peaks
        tl.fromTo(
          "#coin2-flip",
          { filter: "blur(0px)" },
          { filter: "blur(7px)", duration: 0.65, ease: "power2.in" },
          4.45,
        );
        tl.to(
          "#coin2-flip",
          { filter: "blur(0px)", duration: 1.1, ease: "power2.out" },
          5.35,
        );
        // fire-orange edge-glow blooms with the spin
        tl.fromTo(
          "#coin2-glow",
          { opacity: 0, scale: 0.8 },
          { opacity: 0.3, scale: 1, duration: 1.0, ease: "power2.out" },
          4.6,
        );

        // heads-line swap lands on the spoken "AND" (~5.35s)
        tl.set("#coin2-heads-a", { opacity: 0 }, 5.35);
        tl.set("#coin2-heads-b", { opacity: 1 }, 5.35);

        // ── Scene 3 (5.7–8.448s) — "superposition" stamps in; the spin settles; hold ──
        tl.fromTo(
          "#coin2-term",
          { scale: 1.25, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: "power4.out" },
          7.0,
        );

        // glow eases to its resting level and everything holds still
        tl.to("#coin2-glow", { opacity: 0.22, duration: 0.8, ease: "power2.out" }, 7.0);

        window.__timelines["02-spinning-coin"] = tl;
      </script>
    </template>
  </body>
</html>
