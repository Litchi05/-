<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 5 — The catch · dataviz-countup (Adapt, inverted) · 1080x1920 · 10.155s -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Barlow";
          src: url("assets/fonts/Barlow-900.woff2") format("woff2");
          font-weight: 900;
          font-style: normal;
        }
        @font-face {
          font-family: "Barlow";
          src: url("assets/fonts/Barlow-700.woff2") format("woff2");
          font-weight: 700;
          font-style: normal;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2");
          font-weight: 500;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
        }

        .clip {
          position: absolute;
          inset: 0;
        }

        /* ── background: ink ground + frost-blue wash (ground only) ── */
        #catch5-bg {
          background: #111111;
        }
        #catch5-frost {
          position: absolute;
          inset: 0;
          background: linear-gradient(
            180deg,
            rgba(90, 140, 190, 0.16) 0%,
            rgba(70, 110, 160, 0.1) 45%,
            rgba(17, 17, 17, 0) 85%
          );
          opacity: 0;
          will-change: opacity;
        }

        /* ── Scene 1–2: the statement stack ── */
        #catch5-statement {
          position: absolute;
          left: 64px;
          right: 64px;
          top: 560px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 70px;
          font-family: "Barlow", sans-serif;
          color: #f0ece5;
          will-change: transform, opacity;
        }
        #catch5-catch {
          font-size: 200px;
          font-weight: 900;
          line-height: 0.92;
          letter-spacing: -0.04em;
          text-transform: lowercase;
          will-change: transform, opacity;
        }
        #catch5-vibration {
          font-size: 96px;
          font-weight: 700;
          line-height: 1.08;
          letter-spacing: -0.02em;
          text-transform: lowercase;
          max-width: 900px;
        }
        .catch5-word {
          display: inline-block;
          margin: 0 12px;
          will-change: transform, opacity;
        }
        .catch5-word.em {
          color: #e85d26;
        }

        /* ── Scene 3: the temperature readout ── */
        #catch5-temp {
          position: absolute;
          left: 0;
          right: 0;
          top: 520px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          will-change: transform, opacity;
        }
        #catch5-tempval {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 170px;
          line-height: 1.0;
          letter-spacing: -0.02em;
          color: #f0ece5;
          font-variant-numeric: tabular-nums;
          will-change: transform, opacity;
        }
        #catch5-templabel {
          margin-top: 26px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 32px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #888880;
        }
        #catch5-payoff {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 1120px;
          text-align: center;
          font-family: "Barlow", sans-serif;
          font-weight: 900;
          font-size: 118px;
          line-height: 1.0;
          letter-spacing: -0.03em;
          text-transform: lowercase;
          color: #f0ece5;
        }
        .catch5-payword {
          display: inline-block;
          margin: 0 14px;
          will-change: transform, opacity;
        }
        .catch5-payword.em {
          color: #e85d26;
        }
        #catch5-payrule {
          position: absolute;
          left: 370px;
          width: 340px;
          top: 1420px;
          height: 1px;
          background: #505048;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
      </style>

      <div id="root" data-composition-id="05-the-catch" data-width="1080" data-height="1920">
        <!-- full-bleed ground on its own clip -->
        <div id="catch5-bg" class="clip" data-start="0" data-duration="10.155" data-track-index="0">
          <div id="catch5-frost"></div>
        </div>

        <div id="catch5-content" class="clip" data-start="0" data-duration="10.155" data-track-index="1">
          <div id="catch5-statement" data-layout-allow-overlap>
            <div id="catch5-catch">the catch?</div>
            <div id="catch5-vibration">
              <span class="catch5-word">one</span><span class="catch5-word">tiny</span><span class="catch5-word">vibration</span><br />
              <span class="catch5-word em">destroys</span><span class="catch5-word">the</span><span class="catch5-word">magic.</span>
            </div>
          </div>

          <div id="catch5-temp" data-layout-allow-overlap>
            <div id="catch5-tempval">20.000&deg;C</div>
            <div id="catch5-templabel">operating temperature</div>
          </div>

          <div id="catch5-payoff">
            <span class="catch5-payword">colder</span><span class="catch5-payword">than</span><br />
            <span class="catch5-payword em">deep</span><span class="catch5-payword em">space</span>
          </div>
          <div id="catch5-payrule"></div>
        </div>
      </div>

      <script src="assets/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });
        var D = 10.155;

        // ── Scene 1 (0.0–2.0s) — "the catch?" alone, then TRUE stillness (the planned held beat) ──
        tl.fromTo(
          "#catch5-catch",
          { scale: 1.4, filter: "blur(14px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "power4.out" },
          0.25,
        );
        // (0.8–2.2s: deliberate hold — nothing moves)

        // ── Scene 2 (2.0–5.2s) — the vibration line reveals per-word; the shake on "destroys" ──
        var words = document.querySelectorAll(".catch5-word");
        var cues = [2.55, 2.85, 3.15, 3.95, 4.35, 4.6];
        words.forEach(function (w, i) {
          tl.fromTo(
            w,
            { y: 55, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" },
            cues[i],
          );
        });

        // violent decaying jitter-shake on "destroys" (~3.95s) — finite, deterministic,
        // driven by a phase tween (sin with linear decay); dead still by "magic."
        var stEl = document.getElementById("catch5-statement");
        var shake = { p: 0 };
        var SHAKE_T = 3.95, SHAKE_D = 1.05, AMP = 17;
        tl.to(
          shake,
          {
            p: Math.PI * 14,
            duration: SHAKE_D,
            ease: "none",
            onUpdate: function () {
              var k = 1 - shake.p / (Math.PI * 14); // linear decay to zero
              var x = Math.sin(shake.p) * AMP * k;
              var y = Math.sin(shake.p * 0.7 + 1.3) * AMP * 0.6 * k;
              stEl.style.transform = "translate(" + x + "px," + y + "px)";
            },
          },
          SHAKE_T,
        );

        // ── Scene 3 (5.2–10.155s) — scale-swap to the plunging temperature ──
        // outgoing statement shrinks + fades at center as the readout arrives (scale-swap-transition)
        tl.to("#catch5-statement", { scale: 0.82, opacity: 0, duration: 0.55, ease: "power2.in" }, 5.35);
        tl.fromTo(
          "#catch5-temp",
          { scale: 1.18, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          5.7,
        );

        // countdown plunge on "freezers" (~6.6s): 20°C → −273.135°C, mono digits, frost bleeds in
        var tempEl = document.getElementById("catch5-tempval");
        var tv = { v: 20 };
        tl.to(
          tv,
          {
            v: -273.135,
            duration: 2.1,
            ease: "power3.inOut",
            onUpdate: function () {
              tempEl.textContent = tv.v.toFixed(3) + "°C";
            },
          },
          6.5,
        );
        tl.fromTo("#catch5-frost", { opacity: 0 }, { opacity: 1, duration: 2.4, ease: "power2.inOut" }, 6.5);

        // payoff stamps on "colder than deep space" (~8.0s), orange on "deep space"
        var pay = document.querySelectorAll(".catch5-payword");
        var pcues = [7.95, 8.2, 8.55, 8.8];
        pay.forEach(function (w, i) {
          tl.fromTo(
            w,
            { y: 60, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
            pcues[i],
          );
        });
        tl.fromTo(
          "#catch5-payrule",
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, duration: 0.4, ease: "power3.out" },
          9.2,
        );
        // hold the frozen read to the cut — no further motion

        window.__timelines["05-the-catch"] = tl;
      </script>
    </template>
  </body>
</html>
