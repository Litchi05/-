<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 6 — Payoff · kinetic-type-beats (Reproduce) · 1080x1920 · 4.267s · FINAL frame -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Barlow";
          src: url("assets/fonts/Barlow-900.woff2") format("woff2");
          font-weight: 900;
          font-style: normal;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("assets/fonts/IBMPlexMono-400.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "IBM Plex Mono";
          src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2");
          font-weight: 500;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
        }

        .clip {
          position: absolute;
          inset: 0;
        }

        /* ── background: ink ground + faint digit columns (callback to Frame 1) ── */
        #pay6-bg {
          background: #111111;
        }
        #pay6-cols {
          position: absolute;
          inset: 0;
          display: flex;
          justify-content: space-around;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 30px;
          color: #f0ece5;
        }
        .pay6-col {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .pay6-col span {
          display: block;
          line-height: 48px;
        }

        /* ── thesis stack ── */
        #pay6-stack {
          position: absolute;
          left: 64px;
          right: 64px;
          top: 620px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 44px;
          font-family: "Barlow", sans-serif;
          font-weight: 900;
          color: #f0ece5;
        }
        #pay6-l1 {
          font-size: 104px;
          line-height: 1.0;
          letter-spacing: -0.03em;
          text-transform: lowercase;
        }
        .pay6-word {
          display: inline-block;
          margin: 0 12px;
          will-change: transform, opacity;
        }
        #pay6-swapbox {
          position: relative;
          width: 100%;
          height: 300px;
        }
        .pay6-state {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          font-size: 128px;
          line-height: 1.05;
          letter-spacing: -0.03em;
          text-transform: lowercase;
          will-change: transform, opacity;
        }
        #pay6-built .already-wrap {
          position: relative;
          display: inline-block;
        }
        #pay6-underline {
          position: absolute;
          left: 0;
          right: 0;
          bottom: -14px;
          height: 10px;
          background: #e85d26;
          transform-origin: 0% 50%;
          will-change: transform, opacity;
        }

        /* ── follow line: small mono chrome, above the caption band ── */
        #pay6-follow {
          position: absolute;
          left: 0;
          right: 0;
          top: 1470px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 24px;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 30px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #888880;
          will-change: transform, opacity;
        }
        #pay6-follow .slash {
          color: #e85d26;
        }
      </style>

      <div id="root" data-composition-id="06-payoff" data-width="1080" data-height="1920">
        <!-- full-bleed ground on its own clip -->
        <div id="pay6-bg" class="clip" data-start="0" data-duration="4.267" data-track-index="0">
          <div id="pay6-cols"></div>
        </div>

        <div id="pay6-content" class="clip" data-start="0" data-duration="4.267" data-track-index="1">
          <div id="pay6-stack">
            <div id="pay6-l1">
              <span class="pay6-word">the</span><span class="pay6-word">next</span><br />
              <span class="pay6-word">computing</span><br />
              <span class="pay6-word">revolution</span>
            </div>
            <div id="pay6-swapbox">
              <div class="pay6-state" id="pay6-coming" data-layout-allow-overlap>isn&rsquo;t coming.</div>
              <div class="pay6-state" id="pay6-built" data-layout-allow-overlap>
                it&rsquo;s <span class="already-wrap">already<span id="pay6-underline"></span></span><br />
                being built.
              </div>
            </div>
          </div>

          <div id="pay6-follow">
            <span class="slash">/</span><span>follow for more science in 40 seconds</span>
          </div>
        </div>
      </div>

      <script src="assets/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        // ── deterministic digit columns — callback to Frame 1's texture, dimmer ──
        (function () {
          var colsEl = document.getElementById("pay6-cols");
          var NC = 9,
            NR = 40;
          var html = "";
          for (var i = 0; i < NC; i++) {
            html += '<div class="pay6-col">';
            for (var j = 0; j < NR; j++) {
              var ch = (i * 7 + j * 13) % 3 === 0 ? "1" : "0";
              var op = (0.03 + ((i * 11 + j * 5) % 6) * 0.01).toFixed(3);
              html += '<span style="opacity:' + op + '">' + ch + "</span>";
            }
            html += "</div>";
          }
          colsEl.innerHTML = html;
        })();

        var tl = gsap.timeline({ paused: true });
        var D = 4.267;

        // ── Scene 1 (0.0–1.7s) — background callback + the thesis lands per-word ──
        tl.fromTo("#pay6-cols", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);

        var words = document.querySelectorAll(".pay6-word");
        var cues = [0.15, 0.32, 0.55, 0.95];
        words.forEach(function (w, i) {
          tl.fromTo(
            w,
            { y: 60, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
            cues[i],
          );
        });

        // "isn't coming." beat-slams beneath
        tl.fromTo(
          "#pay6-coming",
          { scale: 1.35, filter: "blur(10px)", opacity: 0 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" },
          1.5,
        );
        tl.fromTo("#pay6-built", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        tl.fromTo("#pay6-follow", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

        // ── Scene 2 (1.7–3.1s) — the in-place swap IS the payoff ──
        // hard-cut on "already" (~2.25s): "isn't coming." → "it's already being built."
        tl.set("#pay6-coming", { opacity: 0 }, 2.25);
        tl.fromTo(
          "#pay6-built",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          2.25,
        );

        // fire-orange rule draws itself under "already" (svg-path-draw idiom on a bar)
        tl.fromTo(
          "#pay6-underline",
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, duration: 0.45, ease: "power3.out" },
          2.85,
        );

        // ── Scene 3 (3.1–4.267s) — follow line ticks in; long still hold; final settle ──
        tl.fromTo(
          "#pay6-follow",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          3.3,
        );

        // final frame: a gentle settle — the digit texture eases down as we end
        tl.to("#pay6-cols", { opacity: 0.55, duration: 0.7, ease: "power2.inOut" }, 3.55);

        window.__timelines["06-payoff"] = tl;
      </script>
    </template>
  </body>
</html>
